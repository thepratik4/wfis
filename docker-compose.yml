version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind-forecast-backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      - ELEXON_TIMEOUT_SECONDS=${ELEXON_TIMEOUT_SECONDS:-25}
      - DEFAULT_CUTOFF_TIME=${DEFAULT_CUTOFF_TIME:-11:00}
      - DEFAULT_CUTOFF_DAYS_BEFORE=${DEFAULT_CUTOFF_DAYS_BEFORE:-1}
      - CACHE_DIR=/tmp/wind_forecast_cache
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - wind_cache:/tmp/wind_forecast_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: wind-forecast-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wind_cache:
